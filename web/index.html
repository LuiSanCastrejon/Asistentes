<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atenea</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2em auto; padding: 0 1em; }
  #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: .5em; margin-bottom: .5em; }
  .usuario { text-align: right; color: #0645ad; margin: .4em 0; }
  .atenea { color: #222; margin: .4em 0; }
  form { display: flex; gap: .4em; }
  input { flex: 1; padding: .5em; }
  button { padding: .5em 1em; }
</style>
</head>
<body>
<h1>Atenea</h1>
<div id="chat"></div>
<form id="formulario">
  <input id="texto" placeholder="Escribe una orden..." autocomplete="off">
  <button type="submit">Enviar</button>
  <button type="button" id="microfono">🎤 Hablar</button>
</form>
<p id="estado"></p>

<script>
const chat = document.getElementById("chat");
const estado = document.getElementById("estado");
const botonMic = document.getElementById("microfono");

function agregar(clase, texto) {
  const p = document.createElement("p");
  p.className = clase;
  p.textContent = texto;
  chat.appendChild(p);
  chat.scrollTop = chat.scrollHeight;
}

async function enviar(url, opciones) {
  estado.textContent = "Pensando...";
  try {
    const r = await fetch(url, opciones);
    const datos = await r.json();
    if (datos.error) { estado.textContent = datos.error; return; }
    if (opciones.body instanceof FormData) agregar("usuario", datos.usuario);
    agregar("atenea", datos.respuesta);
    if (datos.audio) new Audio("data:audio/wav;base64," + datos.audio).play();
    estado.textContent = "";
  } catch (e) {
    estado.textContent = "No se pudo conectar con Atenea.";
  }
}

document.getElementById("formulario").addEventListener("submit", e => {
  e.preventDefault();
  const campo = document.getElementById("texto");
  const texto = campo.value.trim();
  if (!texto) return;
  campo.value = "";
  agregar("usuario", texto);
  enviar("/texto", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({texto})
  });
});

// Grabar audio: un clic empieza, otro clic termina y envía
let grabadora = null;
botonMic.addEventListener("click", async () => {
  if (grabadora && grabadora.state === "recording") {
    grabadora.stop();
    return;
  }
  try {
    const flujo = await navigator.mediaDevices.getUserMedia({audio: true});
    const partes = [];
    grabadora = new MediaRecorder(flujo);
    grabadora.ondataavailable = e => partes.push(e.data);
    grabadora.onstop = () => {
      flujo.getTracks().forEach(t => t.stop());
      botonMic.textContent = "🎤 Hablar";
      const formulario = new FormData();
      formulario.append("audio", new Blob(partes, {type: grabadora.mimeType}), "orden");
      enviar("/audio", {method: "POST", body: formulario});
    };
    grabadora.start();
    botonMic.textContent = "⏹ Detener";
    estado.textContent = "Escuchando...";
  } catch (e) {
    estado.textContent = "No se pudo usar el micrófono.";
  }
});
</script>
</body>
</html>
